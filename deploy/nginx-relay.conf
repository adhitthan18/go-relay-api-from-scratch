server {
    listen      80;
    listen [::]:80;
    server_name GANTI_HOSTNAME;

    # Aplikasinya sudah membatasi badan permintaan lewat MaxBytesReader, tapi
    # menolaknya di sini berarti byte-nya tidak pernah sampai ke Go.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Menambahkan alamat pemanggil ke ujung rantai yang sudah ada — persis
        # bentuk yang ditelusuri clientIP dari kanan ke kiri.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }
}